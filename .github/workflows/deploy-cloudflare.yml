name: deploy-cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Desplegar en Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Verificar MESA publicada
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://worker.eduardo-flores-contartese.workers.dev"
          HEALTH="$(curl -sS "$BASE/api/health")"
          STATS="$(curl -sS "$BASE/api/public/stats")"
          echo "HEALTH=$HEALTH"
          echo "STATS=$STATS"
          node -e '
            const h=JSON.parse(process.argv[1]);
            const s=JSON.parse(process.argv[2]);
            if(!h.ok) throw new Error("health no OK: "+(h.storeError||"sin detalle"));
            if(s.error) throw new Error("stats error: "+s.error);
            if(!["google","d1"].includes(h.storage)) throw new Error("storage inválido: "+h.storage);
            if(Number(s.personas)<0) throw new Error("contador personas inválido: "+s.personas);
            if(Number(s.proyectos)<0) throw new Error("contador proyectos inválido: "+s.proyectos);
            console.log("MESA NUEVA OK:", JSON.stringify({storage:h.storage,googleConfigured:h.googleConfigured,personas:s.personas,proyectos:s.proyectos}));
          ' "$HEALTH" "$STATS"
