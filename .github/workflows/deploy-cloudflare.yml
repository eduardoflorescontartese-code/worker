name: deploy-cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Puerta de seguridad
        shell: bash
        run: |
          set -euo pipefail
          npm test
          node --check worker/src/security.js
          node --check worker/src/index.js
          if grep -R "ADMIN_FALLBACK_HASH" worker/src; then
            echo "No se permite autenticación administrativa embebida"
            exit 1
          fi
          if grep -Eq 'ALLOWED_ORIGIN[[:space:]]*=[[:space:]]*"\*"' wrangler.toml; then
            echo "CORS abierto detectado"
            exit 1
          fi

      - name: Verificar secreto administrativo
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          SECRETS="$(npx --yes wrangler@4 secret list 2>/dev/null || true)"
          printf '%s' "$SECRETS" | grep -q "MESA_ADMIN_TOKEN" || {
            echo "Falta MESA_ADMIN_TOKEN en Cloudflare. Se bloquea el despliegue."
            exit 1
          }

      - name: Desplegar en Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Verificar MESA publicada
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://worker.eduardo-flores-contartese.workers.dev"
          HOME="$(curl -sS "$BASE/")"
          HEALTH="$(curl -sS "$BASE/api/health")"
          STATS="$(curl -sS "$BASE/api/public/stats")"
          DASH="$(curl -sS "$BASE/api/public/dashboard")"
          APP="$(curl -sS "$BASE/app.modular.js")"
          echo "HEALTH=$HEALTH"
          echo "STATS=$STATS"
          printf '%s' "$HOME" | grep -q "Panel de Matching"
          printf '%s' "$HOME" | grep -q "Sugerencias para vos"
          printf '%s' "$HOME" | grep -q "Recomendaciones de MESA"
          printf '%s' "$HOME" | grep -q 'id="selfForm"'
          printf '%s' "$HOME" | grep -q "Darme de alta"
          printf '%s' "$APP" | grep -Fq "$('.nav-item').forEach"
          if printf '%s\n' "$APP" | grep -Eq "^[[:space:]]*\\$\\('\\.nav-item'\\)\\.forEach"; then
            echo "Selector múltiple roto detectado en app.modular.js"
            exit 1
          fi
          if printf '%s' "$HOME" | grep -Eqi "inici[aá] sesi[oó]n|login obligatorio|contraseña obligatoria"; then
            echo "La interfaz pública contiene una barrera de acceso inesperada"
            exit 1
          fi
          node -e '
            const h=JSON.parse(process.argv[1]);
            const s=JSON.parse(process.argv[2]);
            if(!h.ok) throw new Error("health no OK: "+(h.storeError||"sin detalle"));
            if(s.error) throw new Error("stats error: "+s.error);
            if(h.storage!=="d1") throw new Error("storage no es D1: "+h.storage);
            if(Number(s.personas)<0) throw new Error("contador personas inválido: "+s.personas);
            if(Number(s.proyectos)<0) throw new Error("contador proyectos inválido: "+s.proyectos);
            const d=JSON.parse(process.argv[3]);
            if((d.counts?.personas??-1)!==Number(s.personas)) throw new Error("dashboard/personas inconsistente");
            if((d.counts?.proyectos??-1)!==Number(s.proyectos)) throw new Error("dashboard/proyectos inconsistente");
            console.log("MESA V2 OK:", JSON.stringify({storage:h.storage,personas:s.personas,proyectos:s.proyectos,ui:"maqueta-publica"}));
          ' "$HEALTH" "$STATS" "$DASH"
