name: mesa-admin-bootstrap-once

on:
  push:
    branches: [main]

jobs:
  rotate-admin:
    if: startsWith(github.event.head_commit.message, 'MESA ADMIN ROTATION ONE-TIME 2026-10-05')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar credencial administrativa
        id: token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -base64 48 | tr -d '\n' | tr '/+' '_-')"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/mesa-admin-token.txt"
      - name: Rotar secreto administrativo en Cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/mesa-admin-token.txt")"
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put MESA_ADMIN_TOKEN
      - name: Entregar credencial al propietario
        uses: actions/upload-artifact@v4
        with:
          name: mesa-admin-credential
          path: ${{ runner.temp }}/mesa-admin-token.txt
          retention-days: 1
          if-no-files-found: error
