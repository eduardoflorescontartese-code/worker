name = "mesa-api"
main = "worker/src/index.js"
compatibility_date = "2026-10-04"

[vars]
ALLOWED_ORIGIN = "*"

[assets]
directory = "./frontend"
binding = "ASSETS"

# Configure secrets with Cloudflare (never commit real values):
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# GOOGLE_REFRESH_TOKEN
# GOOGLE_SPREADSHEET_ID
# GOOGLE_DRIVE_FOLDER_ID
# MESA_ADMIN_TOKEN


[[d1_databases]]
binding = "DB"
database_name = "singulara-business-db"
database_id = "d34776f2-0332-478a-904a-743e5a5e7be1"
